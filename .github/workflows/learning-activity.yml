name: Update learning activity

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/learning-activity.yml'
      - 'scripts/*.mjs'
      - 'scripts/tests/learning-parsers.test.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

concurrency:
  group: learning-activity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test learning parsers
        run: npm test

      - name: Refresh learning card
        run: npm run learning:refresh

      - name: Commit updated learning data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/learning-activity.json assets/learning.light.svg assets/learning.dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(profile): refresh learning activity [skip ci]"
          git push
